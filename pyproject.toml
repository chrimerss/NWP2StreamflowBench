[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwp2sf"
version = "0.1.0"
description = "NWP2StreamflowBench: benchmark NWP precipitation forecasts through a calibrated hydrologic model (dCREST) on CAMELS basins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.10",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "eccodes>=2.38",
  "ecmwf-opendata>=0.3",
  "requests>=2.28",
  "pyyaml>=6",
  "tqdm>=4",
  "torch>=2.0",
  "dcrest @ git+https://github.com/Skyan1002/dCREST.git",
]

[project.optional-dependencies]
# Only needed to (re)build the basin weight matrices from the GAGES-II shapefiles.
basins = ["geopandas>=0.14", "shapely>=2.0", "pyproj>=3.5"]
# WeatherNext 3 on Google Cloud Storage (Zarr v3)
weathernext = ["zarr>=3", "gcsfs>=2024.6", "google-auth>=2"]
test = ["pytest>=7"]

[project.scripts]
nwp2sf = "nwp2sf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
